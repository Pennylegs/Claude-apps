<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NHL Player Quiz</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🏒 NHL Player Quiz</h1>
            <p class="subtitle">Guess the player from their career statistics!</p>
        </header>

        <div class="score-board">
            <div class="score-item">
                <span class="score-label">Score</span>
                <span class="score-value" id="score">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">Streak</span>
                <span class="score-value" id="streak">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">Best</span>
                <span class="score-value" id="best-streak">0</span>
            </div>
        </div>

        <div class="stats-card">
            <h2>Career Statistics</h2>
            <div class="stats-grid" id="stats-grid"></div>
        </div>

        <div class="guess-section">
            <input
                type="text"
                id="guess-input"
                placeholder="Type player name..."
                autocomplete="off"
            >
            <div class="button-row">
                <button id="submit-btn" class="btn btn-primary">Submit Guess</button>
                <button id="hint-btn" class="btn btn-secondary">Get Hint</button>
                <button id="skip-btn" class="btn btn-tertiary">Skip</button>
            </div>
        </div>

        <div class="hint-section" id="hint-section"></div>

        <div class="feedback" id="feedback"></div>
    </div>

    <script src="players.js"></script>
    <script src="app.js"></script>
</body>
</html>
