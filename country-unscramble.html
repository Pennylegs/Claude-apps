<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Unscramble Quiz</title>
    <link rel="stylesheet" href="country-styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Country Unscramble Quiz</h1>
            <p class="subtitle">Unscramble the letters to guess the country!</p>
        </header>

        <div class="score-board">
            <div class="score-item">
                <span class="score-label">Score</span>
                <span class="score-value" id="score">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">Streak</span>
                <span class="score-value" id="streak">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">Best</span>
                <span class="score-value" id="best-streak">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">Round</span>
                <span class="score-value" id="round">1</span>
            </div>
        </div>

        <div class="scramble-card">
            <h2>Unscramble This Country</h2>
            <div class="scrambled-word" id="scrambled-word">
                <!-- Scrambled letters will appear here -->
            </div>
            <div class="clue-section">
                <div class="clue-item">
                    <span class="clue-label">Continent</span>
                    <span class="clue-value" id="continent-clue">---</span>
                </div>
                <div class="clue-item">
                    <span class="clue-label">Population</span>
                    <span class="clue-value" id="population-clue">---</span>
                </div>
            </div>
        </div>

        <div class="guess-section">
            <input
                type="text"
                id="guess-input"
                placeholder="Type the country name..."
                autocomplete="off"
            >
            <div class="button-row">
                <button id="submit-btn" class="btn btn-primary">Submit</button>
                <button id="hint-btn" class="btn btn-secondary">Hint</button>
                <button id="shuffle-btn" class="btn btn-secondary">Reshuffle</button>
                <button id="skip-btn" class="btn btn-tertiary">Skip</button>
            </div>
        </div>

        <div class="hint-section" id="hint-section">
            <!-- Hint will appear here -->
        </div>

        <div class="feedback" id="feedback">
            <!-- Feedback messages appear here -->
        </div>

        <div class="fun-fact" id="fun-fact">
            <!-- Fun fact appears after correct answer -->
        </div>
    </div>

    <script src="countries.js"></script>
    <script src="country-app.js"></script>
</body>
</html>
